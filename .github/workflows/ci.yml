name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # server tests
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      # server lint check, so code the checker flags blocks the merge too
      - run: npm run lint
        working-directory: server
      # client (page) tests, in the same job so a failing one blocks the merge too
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      # client lint check, so code the checker flags blocks the merge too
      - run: npm run lint
        working-directory: client
